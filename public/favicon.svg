<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0b10"/>
    </linearGradient>
    <clipPath id="card-clip">
      <rect x="4" y="8" width="24" height="17" rx="2.5"/>
    </clipPath>
  </defs>

  <!-- App background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>

  <!-- Card body -->
  <rect x="4" y="8" width="24" height="17" rx="2.5" fill="#0f172a"/>

  <!-- Pink header stripe -->
  <rect x="4" y="8" width="24" height="7" fill="#ec4899" clip-path="url(#card-clip)"/>

  <!-- Chip -->
  <rect x="7" y="17.5" width="5" height="4" rx="1" fill="#64748b"/>

  <!-- Card data lines -->
  <rect x="14" y="18" width="11" height="1.5" rx="0.75" fill="#334155"/>
  <rect x="14" y="21" width="8"  height="1.5" rx="0.75" fill="#334155"/>

  <!-- Card border glow -->
  <rect x="4" y="8" width="24" height="17" rx="2.5" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
</svg>
